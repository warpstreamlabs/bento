          - { name: base_currency, type: string }
          - { name: geo_timezone, type: string }
          - { name: mkt_clickid, type: string }
          - { name: mkt_network, type: string }
          - { name: etl_tags, type: string }
          - { name: dvce_sent_tstamp, type: timestamptz }
          - { name: refr_domain_userid, type: string }
          - { name: refr_device_tstamp, type: timestamptz }
          - { name: derived_contexts, type: string }
          - { name: domain_sessionid, type: string }
          - { name: derived_tstamp, type: timestamptz }
          - { name: event_vendor, type: string }
          - { name: event_name, type: string }
          - { name: event_format, type: string }
          - { name: event_version, type: string }
          - { name: event_fingerprint, type: string }
          - { name: true_tstamp, type: timestamptz }
    # Events that don't fit the table are kept instead of dropped.
    - aws_s3:
        bucket: my-bad-rows
        path: opensnowcat/${! timestamp_unix_nano() }.json
