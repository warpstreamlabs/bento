pipeline:
  processors:
    - opensnowcat:
        output_format: enriched_json

output:
  fallback:
    - iceberg:
        catalog:
          type: glue
        warehouse: s3://my-lake
        namespace: analytics
        table: events
        region: us-east-1
        partition_by:
          - day(collector_tstamp)
        table_properties:
          # Min/max statistics for the columns queries filter on, counts for
          # the rest: keeps manifests small with this many columns.
          write.metadata.metrics.default: counts
          write.metadata.metrics.column.collector_tstamp: full
          write.metadata.metrics.column.derived_tstamp: full
          write.metadata.metrics.column.event_name: full
          write.metadata.metrics.column.app_id: full
          write.metadata.metrics.column.event_id: full
        schema:
          - { name: app_id, type: string }
          - { name: platform, type: string }
          - { name: etl_tstamp, type: timestamptz }
          - { name: collector_tstamp, type: timestamptz }
          - { name: dvce_created_tstamp, type: timestamptz }
          - { name: event, type: string }
          - { name: event_id, type: string }
          - { name: txn_id, type: int }
          - { name: name_tracker, type: string }
          - { name: v_tracker, type: string }
          - { name: v_collector, type: string }
          - { name: v_etl, type: string }
          - { name: user_id, type: string }
          - { name: user_ipaddress, type: string }
          - { name: user_fingerprint, type: string }
          - { name: domain_userid, type: string }
          - { name: domain_sessionidx, type: int }
          - { name: network_userid, type: string }
          - { name: geo_country, type: string }
          - { name: geo_region, type: string }
          - { name: geo_city, type: string }
          - { name: geo_zipcode, type: string }
          - { name: geo_latitude, type: double }
          - { name: geo_longitude, type: double }
          - { name: geo_region_name, type: string }
          - { name: ip_isp, type: string }
          - { name: ip_organization, type: string }
          - { name: ip_domain, type: string }
          - { name: ip_netspeed, type: string }
          - { name: page_url, type: string }
          - { name: page_title, type: string }
          - { name: page_referrer, type: string }
          - { name: page_urlscheme, type: string }
          - { name: page_urlhost, type: string }
          - { name: page_urlport, type: int }
          - { name: page_urlpath, type: string }
          - { name: page_urlquery, type: string }
          - { name: page_urlfragment, type: string }
          - { name: refr_urlscheme, type: string }
          - { name: refr_urlhost, type: string }
          - { name: refr_urlport, type: int }
          - { name: refr_urlpath, type: string }
          - { name: refr_urlquery, type: string }
          - { name: refr_urlfragment, type: string }
          - { name: refr_medium, type: string }
          - { name: refr_source, type: string }
          - { name: refr_term, type: string }
          - { name: mkt_medium, type: string }
          - { name: mkt_source, type: string }
          - { name: mkt_term, type: string }
          - { name: mkt_content, type: string }
          - { name: mkt_campaign, type: string }
          - { name: contexts, type: string }
          - { name: se_category, type: string }
          - { name: se_action, type: string }
          - { name: se_label, type: string }
          - { name: se_property, type: string }
          - { name: se_value, type: string }
          - { name: unstruct_event, type: string }
          - { name: tr_orderid, type: string }
          - { name: tr_affiliation, type: string }
          - { name: tr_total, type: double }
          - { name: tr_tax, type: double }
          - { name: tr_shipping, type: double }
          - { name: tr_city, type: string }
          - { name: tr_state, type: string }
          - { name: tr_country, type: string }
          - { name: ti_orderid, type: string }
