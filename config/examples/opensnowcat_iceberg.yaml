          - { name: doc_height, type: int }
          - { name: tr_currency, type: string }
          - { name: tr_total_base, type: double }
          - { name: tr_tax_base, type: double }
          - { name: tr_shipping_base, type: double }
          - { name: ti_currency, type: string }
