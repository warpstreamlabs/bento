[package]
name = "rust_parse_csv"
version = "0.1.0"
edition = "2021"

[dependencies]
csv = "1.3"
prost = "0.14"
prost-types = "0.14"
serde_json = "1.0"

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
strip = true
