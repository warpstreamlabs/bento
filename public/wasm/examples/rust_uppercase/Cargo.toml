[package]
name = "rust_uppercase"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[profile.release]
opt-level = "z"
lto = true
strip = true
