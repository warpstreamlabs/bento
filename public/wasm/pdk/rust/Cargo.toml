[package]
name = "bento-pdk"
version = "0.1.0"
edition = "2021"
description = "Bindings for Bento WASM plugins, which exchange messages with Bento as protobuf."

[dependencies]
bento-pdk-macros = { path = "macros" }
protobuf = "3.7"
serde = "1.0"
serde_json = "1.0"

[build-dependencies]
protobuf-codegen = "3.7"
